name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          cd $HOME/theos && git submodule update --init --recursive
      - name: Build
        env:
          THEOS: ${{ env.HOME }}/theos
        run: |
          make clean || true
          make
      - name: Collect
        run: |
          find .theos/obj -name "LFRNewCustomer.dylib" -exec cp {} . \;
          file LFRNewCustomer.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: LFRNewCustomer
          path: LFRNewCustomer.dylib
